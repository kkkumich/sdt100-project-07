<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1450" viewBox="0 0 1100 1450"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#294863"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="18" fill="#18324a"><text x="550" y="35" text-anchor="middle">Project 7 — Main flow and optimized bubble sort</text><rect x="330" y="60" width="400" height="60" rx="8" fill="#edf5fd" stroke="#294863" stroke-width="2"/><text x="530" y="88" text-anchor="middle">Input n and generation mode</text><polyline points="530,120 530,155" fill="none" stroke="#294863" stroke-width="2" marker-end="url(#arrow)"/><path d="M530 155L680 197.5L530 240L380 197.5Z" fill="#fff3d2" stroke="#294863" stroke-width="2"/><text x="530" y="203.5" text-anchor="middle">Generate random values?</text><rect x="40" y="270" width="300" height="70" rx="8" fill="#edf5fd" stroke="#294863" stroke-width="2"/><text x="190" y="298" text-anchor="middle">Input array elements</text><rect x="750" y="270" width="300" height="70" rx="8" fill="#edf5fd" stroke="#294863" stroke-width="2"/><text x="900" y="298" text-anchor="middle">Generate random array</text><polyline points="380,197 190,197 190,270" fill="none" stroke="#294863" stroke-width="2" marker-end="url(#arrow)"/><text x="267" y="178" text-anchor="middle">No</text><polyline points="680,197 900,197 900,270" fill="none" stroke="#294863" stroke-width="2" marker-end="url(#arrow)"/><text x="785" y="178" text-anchor="middle">Yes</text><polyline points="190,340 190,380 530,380 530,410" fill="none" stroke="#294863" stroke-width="2" marker-end="url(#arrow)"/><polyline points="900,340 900,380 530,380" fill="none" stroke="#294863" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="410" width="400" height="60" rx="8" fill="#edf5fd" stroke="#294863" stroke-width="2"/><text x="530" y="438" text-anchor="middle">Print array; end = n - 1</text><polyline points="530,470 530,505" fill="none" stroke="#294863" stroke-width="2" marker-end="url(#arrow)"/><path d="M530 505L680 547.5L530 590L380 547.5Z" fill="#fff3d2" stroke="#294863" stroke-width="2"/><text x="530" y="553.5" text-anchor="middle">end > 0?</text><polyline points="680,548 1060,548 1060,1170 730,1170" fill="none" stroke="#294863" stroke-width="2" marker-end="url(#arrow)"/><text x="870" y="530" text-anchor="middle">No</text><polyline points="530,590 530,625" fill="none" stroke="#294863" stroke-width="2" marker-end="url(#arrow)"/><text x="565" y="614" text-anchor="middle">Yes</text><rect x="330" y="625" width="400" height="65" rx="8" fill="#edf5fd" stroke="#294863" stroke-width="2"/><text x="530" y="653" text-anchor="middle">swapped = false; j = 0</text><polyline points="530,690 530,720" fill="none" stroke="#294863" stroke-width="2" marker-end="url(#arrow)"/><path d="M530 720L680 760L530 800L380 760Z" fill="#fff3d2" stroke="#294863" stroke-width="2"/><text x="530" y="766" text-anchor="middle">j &lt; end?</text><polyline points="680,760 900,760 900,1000" fill="none" stroke="#294863" stroke-width="2" marker-end="url(#arrow)"/><text x="805" y="742" text-anchor="middle">No</text><polyline points="530,800 530,830" fill="none" stroke="#294863" stroke-width="2" marker-end="url(#arrow)"/><text x="565" y="824" text-anchor="middle">Yes</text><path d="M530 830L680 872.5L530 915L380 872.5Z" fill="#fff3d2" stroke="#294863" stroke-width="2"/><text x="530" y="878.5" text-anchor="middle">a[j] > a[j+1]?</text><rect x="40" y="950" width="300" height="75" rx="8" fill="#edf5fd" stroke="#294863" stroke-width="2"/><text x="190" y="978" text-anchor="middle">Swap neighbours</text><text x="190" y="1002" text-anchor="middle">swapped = true</text><polyline points="380,872 190,872 190,950" fill="none" stroke="#294863" stroke-width="2" marker-end="url(#arrow)"/><text x="282" y="855" text-anchor="middle">Yes</text><rect x="380" y="950" width="300" height="65" rx="8" fill="#edf5fd" stroke="#294863" stroke-width="2"/><text x="530" y="978" text-anchor="middle">j++</text><polyline points="530,915 530,950" fill="none" stroke="#294863" stroke-width="2" marker-end="url(#arrow)"/><text x="562" y="940" text-anchor="middle">No</text><polyline points="340,986 380,986" fill="none" stroke="#294863" stroke-width="2" marker-end="url(#arrow)"/><polyline points="530,1015 530,1050 730,1050 730,760 680,760" fill="none" stroke="#294863" stroke-width="2" marker-end="url(#arrow)"/><path d="M900 1000L1040 1045L900 1090L760 1045Z" fill="#fff3d2" stroke="#294863" stroke-width="2"/><text x="900" y="1051" text-anchor="middle">swapped?</text><polyline points="900,1090 900,1125 1060,1125 1060,1170" fill="none" stroke="#294863" stroke-width="2" marker-end="url(#arrow)"/><text x="1020" y="1108" text-anchor="middle">No</text><rect x="755" y="600" width="285" height="65" rx="8" fill="#edf5fd" stroke="#294863" stroke-width="2"/><text x="897.5" y="628" text-anchor="middle">end--</text><polyline points="900,1000 1080,1000 1080,632 1040,632" fill="none" stroke="#294863" stroke-width="2" marker-end="url(#arrow)"/><text x="1040" y="820" text-anchor="middle">Yes</text><polyline points="755,632 720,632 720,548 680,548" fill="none" stroke="#294863" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="1140" width="400" height="65" rx="8" fill="#edf5fd" stroke="#294863" stroke-width="2"/><text x="530" y="1168" text-anchor="middle">Print sorted array</text><polyline points="530,1205 530,1240" fill="none" stroke="#294863" stroke-width="2" marker-end="url(#arrow)"/><path d="M530 1240L680 1282.5L530 1325L380 1282.5Z" fill="#fff3d2" stroke="#294863" stroke-width="2"/><text x="530" y="1288.5" text-anchor="middle">Continue Y/y?</text><polyline points="380,1282 20,1282 20,90 330,90" fill="none" stroke="#294863" stroke-width="2" marker-end="url(#arrow)"/><text x="170" y="1262" text-anchor="middle">Yes</text><polyline points="530,1325 530,1360" fill="none" stroke="#294863" stroke-width="2" marker-end="url(#arrow)"/><text x="565" y="1350" text-anchor="middle">No</text><rect x="380" y="1360" width="300" height="55" rx="8" fill="#edf5fd" stroke="#294863" stroke-width="2"/><text x="530" y="1388" text-anchor="middle">End</text></g></svg>